<div class="container my-3">
  <div class="barra_pesquisa">
    <input
      type="text"
      class="form-control"
      placeholder="Pesquisar relógio pelo nome..."
      [(ngModel)]="termo"
      (keyup.enter)="buscar()"
    />
    <button class="btn btn-primary" type="button" (click)="buscar()">
      Buscar
    </button>
  </div>
</div>
