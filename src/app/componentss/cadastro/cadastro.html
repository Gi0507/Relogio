<div class="formulario">
    <label>Nome</label> <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required><br>
    <label>E-mail</label> <input type="email" name="email" id="email" placeholder="Digite seu email" required><br>
    <label>telefone</label> <input type="tel" name="telefone" id="telefone" placeholder="99999-9999" required pattern="[0-9]{5}-[0-9]{4}"><br>
    <label>Endereço</label> <input type="endereço" name="endereço" id="endereço" placeholder="Digite seu endereço" required><br>
    <button>Me cadastrar</button>
</div>
